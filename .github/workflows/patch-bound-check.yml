name: Apply narrow bound-check migration

on:
  push:
    branches:
      - fix/check-bound-evaluation-222
    paths:
      - .github/workflows/patch-bound-check.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/check-bound-evaluation-222
      - name: Apply exact maintained-consumer change
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('cmd/agentfence/main.go')
          text = p.read_text()
          old = '\t\tres, event := eng.Evaluate(call)'
          new = '\t\tres, event := eng.EvaluateBound(call)'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one maintained check evaluator, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/patch-bound-check.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cmd/agentfence/main.go .github/workflows/patch-bound-check.yml
          git commit -m 'fix(check): evaluate maintained calls with exact bindings'
          git push origin HEAD:fix/check-bound-evaluation-222
